[platformio]
default_envs = native

[env:native]
platform = native
test_framework = unity
test_build_src = yes
lib_deps = throwtheswitch/Unity@2.6.1
build_unflags = -std=gnu++11
build_flags =
  -std=c++11
  -Wall
  -Wextra
  -Werror
  -pedantic
  -I../tests/generated

; All four boards are ESP32-S (ESP32-WROOM-class) NodeMCU-style boards, built
; as the generic PlatformIO "esp32dev" board.  The platform is pinned to the
; Arduino-ESP32 2.x line (espressif32 6.9.0); src/main.cpp is written against
; that line's ESP-NOW callback signatures.  No upload port is committed: pass
; --upload-port on the command line (see README.md).
[esp32_common]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
  -Wall
  -Wextra

; Plain codec build (no radio role selected).
[env:esp32dev]
extends = esp32_common

; F1 is deliberately split into two small images.  The sender's peer MAC is
; entered at run time over USB, so no board-specific address is committed.
[env:f1_sender]
extends = esp32_common
build_flags =
  ${esp32_common.build_flags}
  -DF1_ROLE_SENDER

[env:f1_receiver]
extends = esp32_common
build_flags =
  ${esp32_common.build_flags}
  -DF1_ROLE_RECEIVER

; F2 exercises C's USB-serial bridge.  It has no radio-forwarding behaviour
; yet; F3 connects this bounded bridge to C's ESP-NOW receive queue.
[env:f2_c]
extends = esp32_common
build_flags =
  ${esp32_common.build_flags}
  -DF2_ROLE_C

; F3a uses the same fixed-memory engine in four explicit role images.  Peer
; MACs are entered over serial at run time; they are never committed.
[env:f3a_a]
extends = esp32_common
build_flags =
  ${esp32_common.build_flags}
  -DF3A_ROLE_A

[env:f3a_b]
extends = esp32_common
build_flags =
  ${esp32_common.build_flags}
  -DF3A_ROLE_B

[env:f3a_c]
extends = esp32_common
build_flags =
  ${esp32_common.build_flags}
  -DF3A_ROLE_C

[env:f3a_d]
extends = esp32_common
build_flags =
  ${esp32_common.build_flags}
  -DF3A_ROLE_D

; F3b keeps F3a's data plane and enables the bounded discovery/control plane.
; MAC addresses are still entered at run time.
[env:f3b_a]
extends = esp32_common
build_flags =
  ${esp32_common.build_flags}
  -DF3A_ROLE_A
  -DF3B_ENABLED

[env:f3b_b]
extends = esp32_common
build_flags =
  ${esp32_common.build_flags}
  -DF3A_ROLE_B
  -DF3B_ENABLED

[env:f3b_c]
extends = esp32_common
build_flags =
  ${esp32_common.build_flags}
  -DF3A_ROLE_C
  -DF3B_ENABLED

[env:f3b_d]
extends = esp32_common
build_flags =
  ${esp32_common.build_flags}
  -DF3A_ROLE_D
  -DF3B_ENABLED

; F3c replaces manual routes with versioned controller installation.  C also
; joins that radio engine to the bounded serial bridge used during controller
; outages; MACs remain runtime-only.
[env:f3c_a]
extends = esp32_common
build_flags =
  ${esp32_common.build_flags}
  -DF3A_ROLE_A
  -DF3B_ENABLED
  -DF3C_ENABLED

; A with a real DHT11 (GPIO4, 3.3 V).  Readings come from the sensor every 2 s; the
; `send VALUE` serial command still works but prints a "NOT a sensor reading" line.
[env:f3c_a_dht11]
extends = env:f3c_a
build_flags =
  ${env:f3c_a.build_flags}
  -DA_DHT11
lib_deps =
  adafruit/DHT sensor library@1.4.6
  adafruit/Adafruit Unified Sensor@1.1.14

[env:f3c_b]
extends = esp32_common
build_flags =
  ${esp32_common.build_flags}
  -DF3A_ROLE_B
  -DF3B_ENABLED
  -DF3C_ENABLED

[env:f3c_c]
extends = esp32_common
build_flags =
  ${esp32_common.build_flags}
  -DF3A_ROLE_C
  -DF3B_ENABLED
  -DF3C_ENABLED
  -DF3C_GATEWAY

[env:f3c_d]
extends = esp32_common
build_flags =
  ${esp32_common.build_flags}
  -DF3A_ROLE_D
  -DF3B_ENABLED
  -DF3C_ENABLED
