[platformio]
default_envs = native

[env:native]
platform = native
test_framework = unity
test_build_src = yes
lib_deps = throwtheswitch/Unity@2.6.1
build_unflags = -std=gnu++11
build_flags =
  -std=c++11
  -Wall
  -Wextra
  -Werror
  -pedantic
  -I../tests/generated

[env:nodemcuv2]
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino
build_flags =
  -Wall
  -Wextra

; F1 is deliberately split into two small images.  The sender's peer MAC is
; entered at run time over USB, so no board-specific address is committed.
[env:f1_sender]
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino
build_flags =
  -Wall
  -Wextra
  -DF1_ROLE_SENDER

[env:f1_receiver]
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino
build_flags =
  -Wall
  -Wextra
  -DF1_ROLE_RECEIVER

; F2 exercises C's USB-serial bridge.  It has no radio-forwarding behaviour
; yet; F3 connects this bounded bridge to C's ESP-NOW receive queue.
[env:f2_c]
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino
build_flags =
  -Wall
  -Wextra
  -DF2_ROLE_C

; F3a uses the same fixed-memory engine in four explicit role images.  Peer
; MACs are entered over serial at run time; they are never committed.
[env:f3a_a]
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino
build_flags =
  -Wall
  -Wextra
  -DF3A_ROLE_A

[env:f3a_b]
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino
build_flags =
  -Wall
  -Wextra
  -DF3A_ROLE_B

[env:f3a_c]
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino
build_flags =
  -Wall
  -Wextra
  -DF3A_ROLE_C

[env:f3a_d]
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino
build_flags =
  -Wall
  -Wextra
  -DF3A_ROLE_D

; F3b keeps F3a's data plane and enables the bounded discovery/control plane.
; MAC addresses are still entered at run time.
[env:f3b_a]
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino
build_flags =
  -Wall
  -Wextra
  -DF3A_ROLE_A
  -DF3B_ENABLED

[env:f3b_b]
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino
build_flags =
  -Wall
  -Wextra
  -DF3A_ROLE_B
  -DF3B_ENABLED

[env:f3b_c]
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino
build_flags =
  -Wall
  -Wextra
  -DF3A_ROLE_C
  -DF3B_ENABLED

[env:f3b_d]
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino
build_flags =
  -Wall
  -Wextra
  -DF3A_ROLE_D
  -DF3B_ENABLED

; F3c replaces manual routes with versioned controller installation.  C also
; joins that radio engine to the bounded serial bridge used during controller
; outages; MACs remain runtime-only.
[env:f3c_a]
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino
build_flags =
  -Wall
  -Wextra
  -DF3A_ROLE_A
  -DF3B_ENABLED
  -DF3C_ENABLED

[env:f3c_b]
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino
build_flags =
  -Wall
  -Wextra
  -DF3A_ROLE_B
  -DF3B_ENABLED
  -DF3C_ENABLED

[env:f3c_c]
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino
build_flags =
  -Wall
  -Wextra
  -DF3A_ROLE_C
  -DF3B_ENABLED
  -DF3C_ENABLED
  -DF3C_GATEWAY

[env:f3c_d]
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino
build_flags =
  -Wall
  -Wextra
  -DF3A_ROLE_D
  -DF3B_ENABLED
  -DF3C_ENABLED
