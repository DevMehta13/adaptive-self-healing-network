[platformio]
default_envs = native

[env:native]
platform = native
test_framework = unity
test_build_src = yes
lib_deps = throwtheswitch/Unity@2.6.1
build_unflags = -std=gnu++11
build_flags =
  -std=c++11
  -Wall
  -Wextra
  -Werror
  -pedantic
  -I../tests/generated

[env:nodemcuv2]
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino
build_flags =
  -Wall
  -Wextra
