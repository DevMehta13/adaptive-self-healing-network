name: Firmware

on:
  push:
    paths:
      - "firmware/**"
      - "tests/generated/test_vectors.h"
      - ".github/workflows/firmware.yml"
  pull_request:
    paths:
      - "firmware/**"
      - "tests/generated/test_vectors.h"
      - ".github/workflows/firmware.yml"

jobs:
  vectors:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: firmware/requirements.txt
      - name: Install PlatformIO
        run: python -m pip install -r requirements.txt
      - name: Check shared protocol vectors
        run: pio test -e native

  esp32-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: firmware/requirements.txt
      - name: Install PlatformIO
        run: python -m pip install -r requirements.txt
      - name: Cross-compile every ESP32 image
        run: pio run -e esp32dev -e f1_sender -e f1_receiver -e f2_c -e f3a_a -e f3a_b -e f3a_c -e f3a_d -e f3b_a -e f3b_b -e f3b_c -e f3b_d -e f3c_a -e f3c_b -e f3c_c -e f3c_d
